<script type="module">

function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

const snr_min = 0.;
const snr_max = 10.;
const beam_x_range = [-0.2, +0.2];
const beam_y_range = [-0.2, +0.2];

//const beam_x_range = [-2.5, +2.5];
//const beam_y_range = [-2.5, +2.5];

function get_color(snr) {
    const t = (snr - snr_min) / (snr_max - snr_min);
    return d3.interpolateInferno(t);
    //return d3.interpolateTurbo(t);
}

function update_plot(data) {
    const N = data["beam_x"].length;
    var newValues = data["sn_cg"];

    const dot = document.querySelector(".dot_plot_class");
    console.log("querySelector: " + dot);
    const kids = dot.children;
    console.log("children: " + kids);
    console.log("length: " + kids.length);

    for (var i=0; i<N; i++) {
	if (i == 0) {
	    console.log("kid: " + kids[i]);
	    for (const k in kids[i]) {
		console.log("key: " + k + " = " + kids[i][k]);
	    }
	    console.log("dataset: " + kids[i]["dataset"]);
	    for (const k in kids[i]["dataset"]) {
		console.log("dataset : " + k + " = " + kids[i]["dataset"][k]);
	    }
	    console.log("getAttributeNames: " + kids[i].getAttributeNames());
	    console.log("getAttribute fill: " + kids[i].getAttribute("fill"));
	    console.log("getAttribute cx: " + kids[i].getAttribute("cx"));
	    console.log("getAttribute cy: " + kids[i].getAttribute("cy"));

	    var cc = get_color(newValues[i]);
	    console.log("new color: " + cc);
	    kids[i].setAttribute("fill", cc);
	}
	// Gotta love an arbitrary, undocumented level of indirection!
	var index = kids[i]["__data__"];
	//var cc = get_color(newValues[i]);
	var cc = get_color(newValues[index]);
	kids[i].setAttribute("fill", cc);
	//kids[i]["fill"] = "#ff0000";
	//kids[i].style.foregroundColor = "red";
	//kids[i].style.fill = "red";
    }
}

function create_plot(data) {
    const dot_plot = Plot.dot(
	{ length: data["beam_x"].length },
	{
	    x: data["beam_x"],
	    y: data["beam_y"],
	    //r: beam_size,
	    r: 20,//data["beam_size"],
	    //stroke: data["sn_cg"],
	    fill: data["sn_cg"],
	    //fillOpacity: 0.5,
	    //mixBlendMode: "lighten",
	    //pointerEvents: "fill",
	    //scheme: "magma",
	});

    dot_plot["id"] = "dot_plot";
    dot_plot["className"] = "dot_plot_class";
    console.log("data: " + dot_plot["data"].length);

    const plot = Plot.plot({
	title: "Maximum FRB trigger S/N per beam",
	grid: true,
	aspectRatio: 1,
	color: {legend: true,
		scheme: "inferno",
		domain: [snr_min, snr_max],
	       },
	// enforce radius range?
	//r: {range: [2, 10]},
	x: {domain: beam_x_range},
	y: {domain: beam_y_range},
	clip: false,
	marks: [
	    Plot.frame(),
	    dot_plot,
	    // red dot that follows the cursor
	    Plot.dot({length: data["beam_x"].length},
		     Plot.pointer({x: data["beam_x"], y: data["beam_y"], stroke: "red",
				   r: 8
				   //r: data["beam_size"],
				  })),
	    // tooltip
	    Plot.tip({length: data["beam_x"].length},
		     Plot.pointer({x: data["beam_x"], y: data["beam_y"],
				   //filter: (d) => d.info,
				   //title: func,
				   title: data["tooltips"],
				  })),
	    //data["sn_cg"]})), //(d) => [d.name, d.info].join("\n\n")})),
	    //sn: data["sn_cg"]})),
	    // crosshairs
	    Plot.crosshair({length: data["beam_x"].length},
			   {x: data["beam_x"], y: data["beam_y"]}),
	],
    });
    return plot;
}
  
const timeslider = document.querySelector("#time_slider");
const timedisplay = document.querySelector("#time_display");
timedisplay.textContent = timeslider.value;
timeslider.addEventListener("input", (event) => {

const beam_time_display = document.querySelector("#beam_time_display");

function set_derived_data(data) {
    const N = data["beam_x"].length;
    var beam_ids = data["beam_id"];
    var tooltips = [];
    for (var i=0; i<N; i++) {
	//var beam_id = i+1;
	var beam_id = beam_ids[i];
	tooltips.push(
	    "Beam: " + beam_id + "\n" +
		"SN: " + data["sn_cg"][i].toFixed(2)
	);
    }
    var beam_size = [];
    for (var i=0; i<N; i++) {
	//beam_size.push(2 + 8*Math.sqrt(i / N));
	beam_size.push(50);
    }
    data["tooltips"] = tooltips;
    data["beam_size"] = beam_size;
}

const div = document.querySelector("#myplot");
//div.append(plot);

var plot = null;

// Animation loop
do {

    const jdata = await d3.json("/beam-max-snr/latest");
    // the structure of "jdata" is a list of beamsets along with parallel data:
    // "beamsets" (int)
    // "timestamps" (date)
    // "timestamps_nano" (float)
    // "beam_ids" (int array)
    // "beam_xs" (float array)
    // "beam_ys" (float array)
    // "beam_snrs" (float array)

    var latest_timestamp = 0n;
    var data = {};
    data["beam_x"] = [];
    data["beam_y"] = [];
    data["sn_cg"] = [];
    data["beam_id"] = [];
    var J = jdata["beamsets"].length;
    console.log("Got " + J + " beamsets");
    for (var j=0; j<J; j++) {
	//K = jdata["beam_snrs"].length;
	//for (var k=0; k<K; k++) {
	//}
	// extend arrays
	data["beam_x"].push(...jdata["beam_xs"][j]);
	data["beam_y"].push(...jdata["beam_ys"][j]);
	data["beam_id"].push(...jdata["beam_ids"][j]);
	data["sn_cg"].push(...jdata["beam_snrs"][j]);

	var tn = jdata["timestamps_nano"][j];
	tn = BigInt(tn);
	if (tn > latest_timestamp)
	    latest_timestamp = tn;
    }
    set_derived_data(data);

    var ts = Temporal.Instant.fromEpochNanoseconds(latest_timestamp);
    var ts_str = ts.toZonedDateTimeISO("UTC");
    beam_time_display.textContent = ts_str;

    const newplot = create_plot(data);

    if (plot) {
	plot.remove();
    }
    div.append(newplot);
    plot = newplot;


    
    console.log("delay...");
    await delay(2000);
} while (true);
